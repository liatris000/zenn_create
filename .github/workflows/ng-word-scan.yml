name: NGワードスキャン

# 実勤務先名など、記事に出してはいけない固有名詞が公開コンテンツに
# 混入していないかをチェックする (Issue #50 再発防止)。
#
# push は全ブランチを対象にする。今回の事案 (origin/article/20260429) は
# PRを経由せずリモートに直接pushされたブランチだったため、PRトリガーだけでは
# 検知できない。ブランチへのpush時点で検知できるようにする。
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    # Dependabot の PR には Actions secrets が渡らない (Dependabot は別の secret ストアを
    # 使う)。そのため NG_WORDS が空になり fail-closed で必ず落ちる。
    # Dependabot は manifest / lockfile しか触らないので、ここでは skip して
    # main への push 時に secrets 付きで検査する (push トリガーは全ブランチ対象)。
    if: github.actor != 'dependabot[bot]'
    # 既定は ubuntu-latest。hosted runner が使えない間だけ、リポジトリ変数 CI_RUNS_ON に
    # '["self-hosted","macOS"]' を入れて Mac へ逃がす（戻すときは変数を消す）。
    # 決まりは personal_dotfiles の docs/ci-runner-levers.md。
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: NGワードスキャン
        env:
          NG_WORDS: ${{ secrets.NG_WORDS }}
        run: bash scripts/ng-word-scan.sh
